name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/_build.yml

  deploy:
    environment: production
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::769814227579:role/engineering-lab-cicd-service
          aws-region: sa-east-1
      - run: aws s3 sync dist/ s3://engineering-lab-assets --delete